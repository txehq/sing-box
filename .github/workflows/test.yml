name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          for file in *.sh src/*.sh tests/*.sh; do bash -n "$file"; done
          shellcheck src/network.sh
      - name: Install validation core
        run: |
          curl -fL --retry 3 -o /tmp/sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-linux-amd64.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
      - name: Profile lifecycle and configuration checks
        env:
          SING_BOX: /tmp/sing-box-1.14.0-linux-amd64/sing-box
        run: |
          bash tests/profile-binding.sh
          bash tests/profile-migration.sh
          python3 tests/profile-menu.py
